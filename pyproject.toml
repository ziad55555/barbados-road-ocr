[project]
name = "barbados-road-ocr"
version = "0.1.0"
description = "Reproducible solution for the R.O.A.D. Barbados Historic Handwriting Challenge"
requires-python = ">=3.11,<3.13"
dependencies = [
    "datasets>=4.0,<5",
    "imagehash>=4.3,<5",
    "jiwer>=4.0,<5",
    "mlx-vlm[train]>=0.5,<0.6",
    "numpy>=2.0,<3",
    "pandas>=2.2,<3",
    "pillow>=11,<13",
    "pyyaml>=6,<7",
    "rapidfuzz>=3.13,<4",
    "scikit-learn>=1.7,<2",
]

[tool.uv]
package = false

[tool.uv.sources]

[tool.ruff]
line-length = 110
